{% extends "base.html" %}
{% block content %}

<div class="crumbs"><a href="/stories">Tasks</a><span class="sep">/</span>{% if story %}Edit{% else %}New{% endif %}</div>

<div class="page-head">
  <h1 class="page-title">{% if story %}Edit story{% else %}New story{% endif %}</h1>
</div>

<div class="card" style="max-width:520px;">
  <form method="post" action="{% if story %}/stories/{{ story.id }}/edit{% else %}/stories{% endif %}">
    <div class="field">
      <label>Code</label>
      <input name="display_code" value="{{ values.display_code }}" placeholder="e.g. PROJ-142" autocomplete="off" required>
    </div>
    <div class="field">
      <label>Title</label>
      <input name="title" value="{{ values.title }}" placeholder="e.g. OWS-W2W (Top-up RO Balance)" required>
    </div>
    <div class="field">
      <label>Assignee</label>
      <select name="assignee_id">
        <option value="">&mdash;</option>
        {% for u in assignees %}<option value="{{ u.id }}" {% if values.assignee_id == u.id | string %}selected{% endif %}>{{ u.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Tester</label>
      <select name="tester_id">
        <option value="">&mdash;</option>
        {% for u in testers %}<option value="{{ u.id }}" {% if values.tester_id == u.id | string %}selected{% endif %}>{{ u.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Developer</label>
      <select name="developer_id">
        <option value="">&mdash;</option>
        {% for u in developers %}<option value="{{ u.id }}" {% if values.developer_id == u.id | string %}selected{% endif %}>{{ u.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Labels</label>
      {% for l in all_labels %}
      <label class="choice">
        <input type="checkbox" name="label_ids" value="{{ l.id }}" {% if l.id in current_label_ids %}checked{% endif %}>
        <span>{{ l.name }}</span>
      </label>
      {% else %}
      <div class="muted" style="font-size:12.5px;">No labels yet — add some under Settings.</div>
      {% endfor %}
    </div>
    {% if story %}
    <div class="field">
      <label>Status</label>
      <select name="status">
        {% for s in statuses %}<option value="{{ s.value }}" {% if values.status == s.value %}selected{% endif %}>{{ s.label }}</option>{% endfor %}
      </select>
    </div>
    {% endif %}
    <div class="form-actions">
      <button class="btn" type="submit">Save</button>
      <a class="btn secondary" href="/stories">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
