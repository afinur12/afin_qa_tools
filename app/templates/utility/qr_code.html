{% extends "base.html" %}
{% block content %}

<div class="crumbs">
  <a href="/utility">Utility</a><span class="sep">/</span>
  {{ tool.name }}
</div>

<div class="page-head">
  <div>
    <h1 class="page-title">{{ tool.name }}</h1>
    <div class="page-sub">{{ tool.desc }}</div>
  </div>
</div>

<div class="card">
  <div class="tool-split">
    <div>
      <div class="field">
        <label>Text or URL</label>
        <textarea class="tool-textarea" id="qr-text" style="min-height:140px;" placeholder="https://example.com">https://it-tools.tech/qrcode-generator</textarea>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Error correction</label>
          <select id="qr-ecl">
            <option value="L">Low (7%)</option>
            <option value="M" selected>Medium (15%)</option>
            <option value="Q">Quartile (25%)</option>
            <option value="H">High (30%)</option>
          </select>
        </div>
        <div class="field">
          <label>Cell size (px)</label>
          <input type="number" id="qr-cell-size" value="6" min="2" max="20">
        </div>
      </div>
      <div id="qr-error" class="error" hidden></div>
    </div>
    <div>
      <div class="tool-label">Preview</div>
      <div class="qr-preview">
        <img id="qr-image" alt="Generated QR code" hidden>
      </div>
      <div class="form-actions" style="justify-content:center; margin-top:14px;">
        <a class="btn" id="qr-download" href="#" download="qrcode.gif">Download</a>
      </div>
    </div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script src="{{ static_url('js/vendor/qrcode/qrcode.js') }}"></script>
<script src="{{ static_url('js/utility/qr_code.js') }}"></script>
{% endblock %}
