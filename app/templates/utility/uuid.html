{% extends "base.html" %}
{% from "macros.html" import icon_copy, icon_refresh with context %}
{% block content %}

<div class="crumbs">
  <a href="/utility">Utility</a><span class="sep">/</span>
  {{ tool.name }}
</div>

<div class="page-head">
  <div>
    <h1 class="page-title">{{ tool.name }}</h1>
    <div class="page-sub">{{ tool.desc }}</div>
  </div>
</div>

<div class="card">
  <div class="tool-toolbar">
    <div class="field" style="margin-bottom:0; width:110px;">
      <label>Quantity</label>
      <input type="number" id="uuid-count" value="5" min="1" max="200">
    </div>
    <label class="row" style="gap:6px; font-size:13.5px; font-weight:500;">
      <input type="checkbox" id="uuid-uppercase" style="width:auto;"> Uppercase
    </label>
    <label class="row" style="gap:6px; font-size:13.5px; font-weight:500;">
      <input type="checkbox" id="uuid-no-hyphens" style="width:auto;"> No hyphens
    </label>
    <div class="spacer"></div>
    <button class="btn" id="uuid-generate" type="button">{{ icon_refresh() }} Generate</button>
    <button class="btn secondary" id="uuid-copy-all" type="button" data-copy>
      {{ icon_copy() }} <span data-copy-label>Copy all</span>
    </button>
  </div>
  <div class="uuid-list" id="uuid-list"></div>
</div>

{% endblock %}
{% block scripts %}
<script src="{{ static_url('js/utility/uuid.js') }}"></script>
{% endblock %}
