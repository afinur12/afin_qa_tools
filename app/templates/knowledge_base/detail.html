{% extends "base.html" %}
{% block title %}{{ card.title }} - Knowledge Base{% endblock %}
{% block content %}
<div class="crumbs"><a href="/knowledge-base">Knowledge Base</a><span class="sep">/</span>{{ card.title }}</div>

<div class="card">
  <form method="post" action="/knowledge-base/{{ card.id }}/edit" data-autosave>
    <div class="card-head" style="justify-content:space-between;">
      <input class="kb-title-input" name="title" value="{{ card.title }}" placeholder="Untitled" autocomplete="off">
      <span class="save-state" data-save-state></span>
    </div>

    <div class="code-block">
      <div class="snippet-actions" style="justify-content:flex-end; margin-bottom:8px;">
        <button class="snippet-icon-btn" type="button" data-card-preview-toggle title="Toggle Markdown preview" aria-label="Toggle Markdown preview">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="snippet-code kb-editor-body" data-card-raw-view>
        <textarea class="snippet-pre snippet-textarea is-wrapped" name="content_markdown" data-card-content spellcheck="false" autocomplete="off" placeholder="Write anything&hellip; markdown, code fences, paste an image.">{{ card.content_markdown }}</textarea>
      </div>
      <div class="snippet-markdown-preview kb-editor-body" data-card-preview-view hidden></div>
    </div>

    <div class="field" style="margin-top:14px;">
      <label>Tags</label>
      {% for l in all_labels %}
      <label class="choice">
        <input type="checkbox" name="label_ids" value="{{ l.id }}" {% if l.id in current_label_ids %}checked{% endif %}>
        <span>{{ l.name }}</span>
      </label>
      {% else %}
      <div class="muted" style="font-size:12.5px;">No labels yet — add some under Settings.</div>
      {% endfor %}
    </div>
  </form>

  <form class="inline-form" method="post" action="/knowledge-base/{{ card.id }}/delete"
        data-confirm="Delete &quot;{{ card.title }}&quot;? This can't be undone." style="margin-top:14px;">
    <button class="btn danger" type="submit">Delete Card</button>
  </form>
</div>
{% endblock %}
{% block scripts %}<script src="{{ static_url('js/knowledge_base.js') }}"></script>{% endblock %}
