<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QA Toolbox{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
{% set path = request.url.path %}
<div class="app">

  <aside class="sidebar">
    <a class="brand" href="/">
      <span class="brand-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </span>
      QA Toolbox
    </a>

    <div class="nav-label">Workspace</div>
    <a class="nav-link {% if path == '/' %}active{% endif %}" href="/">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="9" rx="1.6"/><rect x="14" y="3" width="7" height="5" rx="1.6"/><rect x="14" y="12" width="7" height="9" rx="1.6"/><rect x="3" y="16" width="7" height="5" rx="1.6"/></svg>
      Dashboard
    </a>
    <a class="nav-link {% if path.startswith('/stories') or path.startswith('/subtasks') or path.startswith('/phases') or path.startswith('/testcases') %}active{% endif %}" href="/stories">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="4" width="16" height="16" rx="2.2"/><path d="M8 10h8M8 14h5" stroke-linecap="round"/></svg>
      Tasks
    </a>
    <a class="nav-link {% if path.startswith('/bugs') %}active{% endif %}" href="/bugs">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6a4 4 0 0 1 8 0"/><rect x="6" y="7" width="12" height="13" rx="6"/><path d="M3 12h3M18 12h3M4 17.5l2.5-1.5M20 17.5l-2.5-1.5M4 7.5 6.5 9M20 7.5 17.5 9"/></svg>
      Bugs
    </a>
  </aside>

  <main class="main">
    <div class="main-inner">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      {% block content %}{% endblock %}
    </div>
  </main>

</div>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
