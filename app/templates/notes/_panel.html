<div class="card">
  <div class="card-head">
    <div>
      <div class="card-title">Note Section</div>
      <div class="card-sub">Save snippets &mdash; curl, SQL, JSON, or anything else &mdash; stored verbatim, nothing is executed</div>
    </div>
  </div>

  {% for note in notes %}
  <div class="code-block">
    <div class="code-bar">
      <span class="code-method">{{ note.language }}</span>
      {% if note.remark %}<span class="code-url">{{ note.remark }}</span>{% endif %}
      <div class="spacer"></div>
      <button class="copy-btn" type="button" data-copy>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span data-copy-label>Copy</span>
      </button>
      <form class="inline-form" method="post" action="/notes/{{ note.id }}/delete">
        <input type="hidden" name="attach_type" value="{{ attach_type }}">
        <input type="hidden" name="attach_id" value="{{ attach_id }}">
        <button class="copy-btn" type="submit" title="Remove">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </form>
    </div>
    <pre class="code-body">{{ note.content }}</pre>
  </div>
  {% endfor %}

  <form method="post" action="/notes">
    <input type="hidden" name="attach_type" value="{{ attach_type }}">
    <input type="hidden" name="attach_id" value="{{ attach_id }}">
    <div class="grid-2" style="gap:2px 16px;">
      <div class="field">
        <label>Type</label>
        <select name="language" data-note-language autocomplete="off">
          {% for o in ['CURL', 'JSON', 'SQL', 'TEXT', 'YAML', 'XML', 'BASH', 'PYTHON', 'JAVASCRIPT'] %}
          <option value="{{ o }}">{{ o }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>Remark</label>
        <input name="remark" placeholder="Optional description" autocomplete="off">
      </div>
    </div>
    <div class="field">
      <textarea name="content" rows="4" placeholder="Paste your snippet here&hellip;" data-note-content autocomplete="off" required></textarea>
    </div>
    <button class="btn secondary" type="submit">+ Add Note</button>
  </form>
</div>
