<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", sans-serif; background: #f6f7f9; color: #1b2027; }
    a { color: #3454d1; text-decoration: none; }
    .btn { background: #3454d1; color: #fff; border: none; padding: 9px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn.secondary { background: #fff; color: #1b2027; border: 1px solid #d5d9e0; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: #626b79; margin-bottom: 4px; }
    .field input { width: 100%; padding: 9px 10px; border: 1px solid #d5d9e0; border-radius: 6px; font-size: 14px; font-family: inherit; box-sizing: border-box; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; }
  </style>
</helmet>

<!-- Page behind the modal, dimmed -->
<div style="position:relative; min-height:100%; background:#f6f7f9;">
  <div style="padding:28px 32px; max-width:900px; filter:blur(1.5px); opacity:0.5;">
    <div style="font-size:12px; color:#8a93a1; margin-bottom:10px;">EX-142</div>
    <div style="background:#fff; border:1px solid #e3e6ea; border-radius:8px; padding:20px; margin-bottom:16px;">
      <h3 style="margin:0 0 12px 0; font-size:15px;">SIT</h3>
      <div style="padding:10px 0; border-top:1px solid #eceef1; color:#626b79; font-size:14px;">SIT-EX142 &nbsp; SIT OWS-W2W (Top-up RO Balance)</div>
    </div>
  </div>

  <!-- Dim overlay -->
  <div style="position:absolute; inset:0; background:rgba(17,20,28,0.45); display:flex; align-items:center; justify-content:center;">

    <!-- Modal, centered -->
    <div style="background:#fff; border-radius:12px; box-shadow:0 20px 60px rgba(15,20,35,0.28); width:480px; padding:28px;">
      <div style="display:flex; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0; font-size:18px;">New Subtask &middot; SIT</h2>
        <div style="flex-grow:1;"></div>
        <button type="button" style="border:none; background:transparent; color:#8a93a1; cursor:pointer; padding:4px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="field">
        <label>Code</label>
        <input value="SIT-EX142">
      </div>

      <div class="field">
        <label>Task Title</label>
        <input value="OWS-W2W (Top-up RO Balance)" placeholder="e.g. OWS-W2W (Top-up RO Balance)">
      </div>

      <div style="background:#f6f7f9; border:1px solid #eceef1; border-radius:8px; padding:12px 14px; margin-bottom:20px;">
        <div style="font-size:11px; font-weight:600; color:#8a93a1; text-transform:uppercase; margin-bottom:4px;">Display Title (auto-generated)</div>
        <div class="mono" style="font-size:13px; color:#1b2027;">SIT OWS-W2W (Top-up RO Balance)</div>
      </div>

      <div style="font-size:12px; color:#8a93a1; margin-bottom:20px; display:flex; gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0; margin-top:1px;"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        Every subtask is a single Execution task for its phase &mdash; no separate type needed.
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button class="btn secondary" type="button">Cancel</button>
        <button class="btn" type="button">Save</button>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
